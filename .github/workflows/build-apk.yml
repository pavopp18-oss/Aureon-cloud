name: Build Aureon Cloud APK

on:
  workflow_dispatch:
  push:
    paths:
      - "aureon-cloud/android-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aureon-cloud/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: aureon-cloud/android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: aureon-cloud-apk
          path: aureon-cloud/android-app/android/app/build/outputs/apk/debug/app-debug.apk
