# Forgejo/Aureon Git version. (GitHub wala alag hai: .github/workflows/build-apk.yml)
# Pehle runner chalana padega (README dekho), phir Actions tab -> Run workflow.
name: Build Aureon Cloud APK

on:
  workflow_dispatch:
  push:
    paths:
      - "aureon-cloud/android-app/**"
      - ".forgejo/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          (command -v unzip curl >/dev/null) || (apt-get update && apt-get install -y unzip curl)
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: aureon-cloud/android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: aureon-cloud-apk
          path: aureon-cloud/android-app/android/app/build/outputs/apk/debug/app-debug.apk
